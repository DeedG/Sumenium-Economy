name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sumenium-economy
          path: build/libs/*.jar
      - name: Test de démarrage (serveur 26.3 réel)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\n" > run/server.properties
          timeout 600 gradle runSelftest --stacktrace || true
          cat run/selftest.txt
          grep -q "SELFTEST OK" run/selftest.txt
      - name: Logs du serveur
        if: always()
        run: tail -n 200 run/logs/latest.log || true
