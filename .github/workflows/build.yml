name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sumenium-economy
          path: build/libs/*.jar
      - name: Test de démarrage (serveur 26.3 réel)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\n" > run/server.properties
          timeout 600 gradle runSelftest --stacktrace || true
          echo "::notice title=selftest vanilla::$(head -1 run/selftest.txt) — $(grep -c '^OK' run/selftest.txt) vérifications OK"
          grep '^ECHEC' run/selftest.txt | while IFS= read -r line; do echo "::error title=selftest vanilla::$line"; done
          grep -q "SELFTEST OK" run/selftest.txt
      - name: Test de démarrage avec Lithium (comme le serveur)
        if: always()
        run: |
          rm -rf run/world run/sumenium-data run/config/savs-common-economy run/selftest.txt
          mkdir -p run/mods
          url=$(curl -s 'https://api.modrinth.com/v2/project/lithium/version?game_versions=%5B%2226.3%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].files[0].url')
          echo "Lithium : $url"
          curl -sL -o run/mods/lithium.jar "$url"
          timeout 600 gradle runSelftest --stacktrace || true
          echo "::notice title=selftest lithium::$(head -1 run/selftest.txt) — $(grep -c '^OK' run/selftest.txt) vérifications OK — $url"
          grep '^ECHEC' run/selftest.txt | while IFS= read -r line; do echo "::error title=selftest lithium::$line"; done
          grep -q "SELFTEST OK" run/selftest.txt
      - name: Logs du serveur
        if: always()
        run: tail -n 200 run/logs/latest.log || true
